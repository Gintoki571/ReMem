[package]
name = "neocortex"
version = "0.1.4"
edition = "2021"
description = "Long-term memory for AI agents: BM25 + vector + graph + temporal retrieval in one SQLite file"
license = "MIT"
repository = "https://github.com/Gintoki571/neocortex"

[dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }
sqlite-vec = "=0.1.9"
graphqlite = "0.12"
candle-core = "0.11"
candle-nn = "0.11"
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "neocortex"
path = "src/main.rs"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.dev.package."*"]
opt-level = 3
