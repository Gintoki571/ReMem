[package]
name = "remem-embed"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
candle-core = "0.11"
candle-nn = "0.11"
candle-transformers = "0.11"
tokenizers = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = []
cuda = ["candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda"]
