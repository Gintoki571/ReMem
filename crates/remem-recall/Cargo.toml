[package]
name = "remem-recall"
version = "0.1.0"
edition = "2021"

[dependencies]
remem-types = { path = "../remem-types" }
remem-store = { path = "../remem-store" }
remem-graph = { path = "../remem-graph" }
remem-embed = { path = "../remem-embed" }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
rusqlite = { version = "0.32", features = ["bundled"] }

[[bin]]
name = "remem"
path = "src/main.rs"
